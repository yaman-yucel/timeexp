# Upstream: public pool, Cloudflare with NTS (authenticated NTP), TÜBİTAK UME
pool pool.ntp.org iburst maxsources 4
server time.cloudflare.com iburst nts
# Turkey national time lab (TÜBİTAK UME), stratum 1
server time.ume.tubitak.gov.tr iburst
# Serve time to anyone who reaches the container
allow all
# Keep serving (stratum 10) even if upstream disappears
local stratum 10
driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony
log measurements statistics tracking
logdir /var/log/chrony
